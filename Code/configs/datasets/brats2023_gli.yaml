schema_version: 1
dataset_id: 501
dataset_name: Dataset501_BraTS2023GLI
description: BraTS 2023 Adult Glioma Pre-Treatment
expected_training_cases: 1251
expected_validation_cases: 219
case_id_pattern: '^BraTS-GLI-[0-9]{5}-[0-9]{3}$'
file_ending: .nii.gz

modalities:
  '0000': t1n
  '0001': t1c
  '0002': t2w
  '0003': t2f

channel_names:
  '0': T1n
  '1': T1c
  '2': T2w
  '3': T2F

raw_labels:
  background: 0
  NCR: 1
  ED: 2
  ET: 3

# Mapping order is scientifically meaningful and must not be alphabetized.
regions:
  background: 0
  whole_tumor: [1, 2, 3]
  tumor_core: [1, 3]
  enhancing_tumor: 3

# WT-only -> ED, TC -> NCR, ET -> ET.
regions_class_order: [2, 1, 3]

