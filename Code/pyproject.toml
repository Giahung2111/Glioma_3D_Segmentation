[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glioma-seg"
version = "0.1.0"
description = "Reproducible orchestration and evaluation for 3D glioma segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "matplotlib>=3.7,<4",
  "nibabel>=5.2,<6",
  "numpy>=1.24,<3",
  "psutil>=5.9,<8",
  "PyYAML>=6.0,<7",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
glioma-validate-data = "glioma_seg.data.validate:main"
glioma-convert-nnunet = "glioma_seg.data.nnunet_conversion:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["glioma_seg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["glioma_seg"]
